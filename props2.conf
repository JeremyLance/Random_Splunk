[log4j]

SHOULD_LINEMERGE = false

BREAK_ONLY_BEFORE = ^(?:\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d{3}|####<\w{3}\s+\d{1,2},\s+\d{4}|javax\.net\.ssl\|)

TIME_FORMAT = %Y-%m-%d %H:%M:%S.%3N
MAX_TIMESTAMP_LOOKAHEAD = 23

TRUNCATE = 0
MAX_EVENTS = 10000

KV_MODE = none

REPORT-log4j_header = log4j_header
REPORT-ssl_fields = log4j_ssl
REPORT-weblogic_header = log4j_weblogic


