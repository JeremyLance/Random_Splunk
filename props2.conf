########################################
# TEXT SOURCETYPE
########################################

[text]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d{3})
TRUNCATE = 0

TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S.%3N
MAX_TIMESTAMP_LOOKAHEAD = 30

KV_MODE = none

REPORT-text_header = text_header
REPORT-text_kv = text_kv_extract
REPORT-text_cmd_time = text_cmd_time


########################################
# LOG4J SOURCETYPE
########################################

[log4j]
SHOULD_LINEMERGE = false

LINE_BREAKER = ([\r\n]+)(?=(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d{3}|####<\w{3}\s+\d{1,2},\s+\d{4}|javax\.net\.ssl\|))

TRUNCATE = 0

TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S.%3N
MAX_TIMESTAMP_LOOKAHEAD = 30

KV_MODE = none

REPORT-log4j_header = log4j_header
REPORT-ssl_fields = log4j_ssl
REPORT-weblogic_header = log4j_weblogic


########################################
# XML SOURCETYPE
########################################

[xml]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=<msg\s)
TRUNCATE = 0

TIME_PREFIX = time='
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 35

KV_MODE = xml
