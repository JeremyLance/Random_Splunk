[source::E:\SoapServer\logs\*.log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
MAX_EVENTS = 1024
TRUNCATE = 200000

[sourcetype::mcds_soap]
########################################
# EVENT BREAKING
########################################

SHOULD_LINEMERGE = false

# Break on NEW SOAP transaction start
BREAK_ONLY_BEFORE = ^\*?\s*(SOAP REQUEST RECEIVED|SOAP RESPONSE)

# Allow large multi-line events
TRUNCATE = 0
MAX_EVENTS = 1000

########################################
# TIMESTAMP EXTRACTION
########################################

# Extract ONLY from TIME: field
TIME_PREFIX = ^TIME:\s+
TIME_FORMAT = %d/%b/%Y:%H:%M:%S

# Limit search area so Splunk ignores XML timestamps
MAX_TIMESTAMP_LOOKAHEAD = 25

########################################
# PREVENT BAD TIMESTAMP PICKUP
########################################

# Reduce garbage matching
DATETIME_CONFIG = CURRENT

########################################
# OPTIONAL STABILITY TUNING
########################################

# Avoid future/past rejection
MAX_DIFF_SECS_AGO = 86400
MAX_DIFF_SECS_HENCE = 86400
MAX_DAYS_AGO = 3650
MAX_DAYS_HENCE = 3650
