########################################
# TEXT TRANSFORMS
########################################

[text_header]
REGEX = ^(?<event_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+:(?<component>[^:]+):(?<thread_id>\d+):\s+\[\s*(?<level>\w+)\]\s+\{(?<context>[^\}]+)\}

[text_kv_extract]
REGEX = (?m)^\s*([^:\n]+?)\s*:\s+(.*)$
FORMAT = $1::$2

[text_cmd_time]
REGEX = Last\s+initiated\s+command\s+timestamp\s*:\s*(?<cmd_time>\d{2}/\d{2}/\d{4}\s+\d{2}:\d{2}:\d{2})


########################################
# LOG4J TRANSFORMS
########################################

[log4j_header]
REGEX = ^(?<event_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+\[(?<thread>[^\]]+)\]\s+(?<level>\w+)\s+(?<class>[^\s]+)\s*:\s*(?<message>.*)

[log4j_ssl]
REGEX = ^javax\.net\.ssl\|(?<ssl_level>[^|]+)\|(?<ssl_id>[^|]+)\|(?<thread>[^|]+)\|(?<ssl_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} UTC)\|(?<source_file>[^|]+)\|(?<ssl_message>.*)

[log4j_weblogic]
REGEX = ####<(?<wl_timestamp>\w{3}\s+\d{1,2},\s+\d{4}\s+\d{1,2}:\d{2}:\d{2},\d{3}\s+[AP]M\s+\w+)> <(?<wl_severity>[^>]+)> <(?<wl_subsystem>[^>]+)> <(?<wl_host>[^>]+)> <(?<wl_server>[^>]+)> <(?<wl_thread>[^>]+)>
