########################################
# TEXT TRANSFORMS
########################################

[text_header]
REGEX = ^(?<event_time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})\s+:(?<component>[^:]+):(?<thread_id>\d+):\s+\[\s*(?<level>\w+)\]\s+\{(?<context>[^\}]+)\}

[text_kv_extract]
REGEX = (?m)^\s*([^:\n]+?)\s*:\s+(.*)$
FORMAT = $1::$2

[text_cmd_time]
REGEX = Last\s+initiated\s+command\s+timestamp\s*:\s*(?<cmd_time>\d{2}/\d{2}/\d{4}\s+\d{2}:\d{2}:\d{2})
