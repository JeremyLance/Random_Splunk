############################################################
[remove_sourcetype_suffix]
REGEX = ^(.+?)(?:-(?:too_small|\d+))$
FORMAT = sourcetype::$1
DEST_KEY = MetaData:Sourcetype

############################################################
# Explicit numeric suffix cleanup
# Use only if you want a separate transform chain from props.conf.
############################################################
[strip_numeric_suffix]
REGEX = ^(.+?)-\d+$
FORMAT = sourcetype::$1
DEST_KEY = MetaData:Sourcetype

############################################################
# Explicit -too_small cleanup
# Use only if you want a separate transform chain from props.conf.
############################################################
[strip_toosmall_suffix]
REGEX = ^(.+?)-too_small$
FORMAT = sourcetype::$1
DEST_KEY = MetaData:Sourcetype

############################################################
# Identity route - explicitly keep matching events
# Useful as a safety/no-op transform in chained routing scenarios.
############################################################
[identity]
REGEX = .
DEST_KEY = queue
FORMAT = indexQueue

############################################################
# Optional malformed/empty event drop
# Do NOT enable globally unless tested.
# Activate from props.conf only for sources where blank events are noise.
############################################################
[drop_empty_events]
REGEX = ^\s*$
DEST_KEY = queue
FORMAT = nullQueue

############################################################
# Optional JSON timestamp field extraction to indexed metadata
# Note:
#   This extracts a raw timestamp string into metadata, but Splunk timestamp
#   assignment is still best handled with TIME_PREFIX/TIME_FORMAT in props.conf.
#   Enable only if you have a specific downstream use for indexed metadata.
############################################################
[extract_json_event_time_meta]
REGEX = "(?:time|timestamp|eventTime|TimeGenerated|date)"\s*:\s*"([^"]+)"
FORMAT = json_event_time::$1
DEST_KEY = _meta

############################################################
# Force sourcetype definitions from the provided transforms file
############################################################
[force_dnf]
REGEX = .
FORMAT = sourcetype::dnf
DEST_KEY = MetaData:Sourcetype

[force_cloudwatch]
REGEX = .
FORMAT = sourcetype::aws_cloudwatch_agent
DEST_KEY = MetaData:Sourcetype

[force_cloud_init]
REGEX = .
FORMAT = sourcetype::cloud_init
DEST_KEY = MetaData:Sourcetype

[force_cloud_init_output]
REGEX = .
FORMAT = sourcetype::cloud_init_output
DEST_KEY = MetaData:Sourcetype

[force_jstack]
REGEX = .
FORMAT = sourcetype::jstack
DEST_KEY = MetaData:Sourcetype

[force_instance_state]
REGEX = .
FORMAT = sourcetype::emr_instance_state
DEST_KEY = MetaData:Sourcetype

[force_traps]
REGEX = .
FORMAT = sourcetype::trapsd
DEST_KEY = MetaData:Sourcetype

