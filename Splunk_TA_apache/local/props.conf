[httpd]

########################################
# LINE BREAKING
########################################

SHOULD_LINEMERGE = false

# Break on your bracket-style timestamp
LINE_BREAKER = ([\r\n]+)(?=\[\d{2}/\d{2}/\d{4}\])

TRUNCATE = 0

########################################
# TIMESTAMP
########################################

TIME_PREFIX = ^
TIME_FORMAT = \[%m/%d/%Y\]\[%H:%M:%S\]
MAX_TIMESTAMP_LOOKAHEAD = 25

########################################
# FIELD EXTRACTION
########################################

KV_MODE = none

REPORT-httpd_waf = httpd_waf_fields
