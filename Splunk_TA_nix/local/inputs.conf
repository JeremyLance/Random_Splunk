###############################################################################
# Explicitly disable broad directory monitors. Several UFs are sweeping all of
# /var/log (cloud-init, instance-state, commvault, rotated .gz/.bz2, etc.) with
# no sourcetype, which creates thousands of learned sourcetypes.
# Same stanza names here override lower-precedence apps on DS-managed UFs.
# NOTE: cannot override $SPLUNK_HOME/etc/system/local on rogue agents.
###############################################################################
[monitor:///var/log]
disabled = 1

[monitor:///var/log/]
disabled = 1

[monitor:///var/adm]
disabled = 1

############################################################
# Linux Security Telemetry Collection
#
# Universal Acquisition Baseline
#
# Index Strategy
#
# sec_auth_uhgid-000024
#   Authentication / Identity Telemetry
#
# sec_os_uhgid-000024
#   Host Security / Operating System Telemetry
#
# sec_dns_uhgid-000024
#   DNS Server Telemetry
#
# sec_weblogs_uhgid-000024
#   Web Server Access / Error Logs
#
############################################################

############################
# AUDITD (PRIMARY TELEMETRY)
############################

[monitor:///var/log/audit/audit.log]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = linux_audit
ignoreOlderThan = 30d

############################
# AUTHENTICATION / IDENTITY
############################

[monitor:///var/log/auth.log]
disabled = 0
index = sec_auth_uhgid-000024
sourcetype = linux_secure
ignoreOlderThan = 30d

[monitor:///var/log/secure]
disabled = 0
index = sec_auth_uhgid-000024
sourcetype = linux_secure
ignoreOlderThan = 30d

[monitor:///var/log/sudo.log]
disabled = 0
index = sec_auth_uhgid-000024
sourcetype = linux_secure
ignoreOlderThan = 30d

############################
# LOGIN HISTORY
#
# Low-volume, high-value telemetry useful for:
# - Login reconstruction
# - Failed login investigations
# - Account compromise analysis
############################

[monitor:///var/log/wtmp]
disabled = 0
index = sec_auth_uhgid-000024
sourcetype = linux_wtmp

[monitor:///var/log/btmp]
disabled = 0
index = sec_auth_uhgid-000024
sourcetype = linux_btmp

############################
# SYSTEM / HOST TELEMETRY
############################

[monitor:///var/log/messages]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = syslog
ignoreOlderThan = 30d

[monitor:///var/log/syslog]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = syslog
ignoreOlderThan = 30d

[monitor:///var/log/chrony]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = syslog
recursive = true
blacklist = (\.gz|\.bz2|\.\d+)$
ignoreOlderThan = 30d

############################
# KERNEL TELEMETRY
############################

[monitor:///var/log/kern.log]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = linux_kern
ignoreOlderThan = 30d

[monitor:///var/log/dmesg]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = linux_kern
ignoreOlderThan = 30d

############################
# SCHEDULED TASKS
#
# Useful for detecting persistence,
# automation abuse, and malware activity.
############################

[monitor:///var/log/cron]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = cron
ignoreOlderThan = 30d

############################
# PACKAGE MANAGEMENT
#
# Supports software inventory, change
# tracking, and supply-chain investigations.
############################

[monitor:///var/log/yum.log]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = linux_yum
ignoreOlderThan = 30d

[monitor:///var/log/dpkg.log]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = linux_dpkg
ignoreOlderThan = 30d

############################
# FIREWALL / NETWORK
############################

[monitor:///var/log/ulog/syslogemu.log]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = iptables
ignoreOlderThan = 30d

############################
# BRUTE FORCE PROTECTION
############################

[monitor:///var/log/fail2ban.log]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = syslog
ignoreOlderThan = 30d

############################
# CONTAINER PLATFORM
#
# Safe to leave enabled.
# Hosts without Docker simply will not
# generate events for this stanza.
############################

[monitor:///var/log/docker.log]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = docker:daemon
ignoreOlderThan = 30d

############################
# FILE INTEGRITY MONITORING
#
# Low-volume, high-value telemetry.
############################

[monitor:///var/log/aide/aide.log]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = linux_aide
ignoreOlderThan = 30d

[monitor:///var/log/tripwire/twlog.txt]
disabled = 0
index = sec_os_uhgid-000024
sourcetype = tripwire
ignoreOlderThan = 30d

############################
# DNS SERVER QUERY LOGS
#
# Safe to leave enabled as part of a
# universal Linux baseline.
#
# Hosts that do not run BIND simply
# will not generate events.
############################

[monitor:///var/log/named/queries.log]
disabled = 0
index = sec_dns_uhgid-000024
sourcetype = bind:query
ignoreOlderThan = 30d

############################
# WEB ACCESS LOGS
############################

[monitor:///var/log/nginx/access.log]
disabled = 0
index = sec_weblogs_uhgid-000024
sourcetype = nginx:access
ignoreOlderThan = 30d

[monitor:///var/log/apache2/access.log]
disabled = 0
index = sec_weblogs_uhgid-000024
sourcetype = access_combined
ignoreOlderThan = 30d

[monitor:///var/log/httpd/access_log]
disabled = 0
index = sec_weblogs_uhgid-000024
sourcetype = access_combined
ignoreOlderThan = 30d

############################
# WEB ERROR LOGS
############################

[monitor:///var/log/nginx/error.log]
disabled = 0
index = sec_weblogs_uhgid-000024
sourcetype = nginx:error
ignoreOlderThan = 30d

[monitor:///var/log/apache2/error.log]
disabled = 0
index = sec_weblogs_uhgid-000024
sourcetype = apache:error
ignoreOlderThan = 30d

[monitor:///var/log/httpd/error_log]
disabled = 0
index = sec_weblogs_uhgid-000024
sourcetype = apache:error
ignoreOlderThan = 30d

############################
# KUBERNETES
#
# Disabled by default.
#
# Kubernetes environments typically use
# dedicated container logging pipelines.
#
# Container logs can generate extremely
# large ingestion volumes.
#
# Enable only when Kubernetes container
# log collection is part of onboarding.
############################

[monitor:///var/log/containers]
disabled = 1
index = sec_os_uhgid-000024
sourcetype = k8s:container
recursive = true
