#########################################################
# ZZZ_syslog_cleanup
# Drop known noisy infrastructure logs at HF
#########################################################
[default]
TRANSFORMS-drop-noisy = zzz_drop_by_source

[source::/var/log/cloud-init*]
TRANSFORMS-null = zzz_drop_noisy_sources

[source::/var/log/instance-state/*]
TRANSFORMS-null = zzz_drop_noisy_sources

[source::/var/log/tmp/emr/*]
TRANSFORMS-null = zzz_drop_noisy_sources

[source::/var/log/waagent*]
TRANSFORMS-null = zzz_drop_noisy_sources

[source::/var/log/amazon/ssm/*]
TRANSFORMS-null = zzz_drop_noisy_sources

[source::/opt/dynatrace/*]
TRANSFORMS-null = zzz_drop_noisy_sources

[source::/var/log/dynatrace/*]
TRANSFORMS-null = zzz_drop_noisy_sources

[source::/var/lib/amazon/ssm/*]
TRANSFORMS-null = zzz_drop_noisy_sources

[source::/var/log/amazon/amazon-cloudwatch-agent/*]
TRANSFORMS-null = zzz_drop_noisy_sources
########################################
# AUDITD (CRITICAL)
########################################
[source::/var/log/audit/audit.log]
TRANSFORMS-routing = set_linux_audit

[linux_audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = msg=audit\(
TIME_FORMAT = %s.%3N
MAX_TIMESTAMP_LOOKAHEAD = 20
TRUNCATE = 10000
TRANSFORMS-drop_proctitle = linux_audit_drop_proctitle
TRANSFORMS-drop_noisy_sourcetypes = ruleset_generic_suffix_drop, ruleset_literal_name_drop, ruleset_host_drop

[source::/var/log/audit/audit\.log(\.\d+)?]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = msg=audit\(
TIME_FORMAT = %s.%3N
MAX_TIMESTAMP_LOOKAHEAD = 20
TRUNCATE = 10000
TRANSFORMS-drop_proctitle = linux_audit_drop_proctitle
TRANSFORMS-rename_to_linux_audit = force_sourcetype_linux_audit

########################################
# LOGIN DATABASES
########################################
[source::/var/log/wtmp]
TRANSFORMS-routing = set_linux_wtmp

[source::/var/log/btmp]
TRANSFORMS-routing = set_linux_btmp

#######################################
# CRON
########################################
[source::/var/log/cron]
TRANSFORMS-routing = set_linux_cron

[cron]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %b %e %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
TRUNCATE = 10000
TRANSFORMS-drop_noisy_sourcetypes = ruleset_generic_suffix_drop, ruleset_literal_name_drop, ruleset_host_drop

########################################
# SYSLOG / SYSTEM
########################################
[source::/var/log/messages]
TRANSFORMS-routing = set_syslog

[source::/var/log/messages]
TRANSFORMS-fix_sourcetype=st_syslog

[source::/var/log/chrony/measurements.log]
TRANSFORMS-rename_to_chrony = force_sourcetype_chrony
TRANSFORMS-drop_noisy_sourcetypes = ruleset_generic_suffix_drop, ruleset_literal_name_drop, ruleset_host_drop

[chrony_measurements]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 19
TZ = UTC
TRUNCATE = 10000
TRANSFORMS-drop_noisy_sourcetypes = ruleset_generic_suffix_drop, ruleset_literal_name_drop, ruleset_host_drop

[source::/var/log/syslog]
TRANSFORMS-routing = set_syslog

[syslog]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}\s)
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
TRUNCATE = 0
MAX_DAYS_AGO = 3650
MAX_DAYS_HENCE = 2
TRANSFORMS-drop_noisy_sourcetypes = ruleset_generic_suffix_drop, ruleset_literal_name_drop, ruleset_host_drop
# --- OMI logs, currently mislabeled syslog:linux ---
[syslog:linux]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 25
TRUNCATE = 10000
TRANSFORMS-rename_to_syslog = force_sourcetype_syslog
TRANSFORMS-drop_noisy_sourcetypes = ruleset_generic_suffix_drop, ruleset_literal_name_drop, ruleset_host_drop

# --- Ceph/bash logs, currently mislabeled linux:syslog ---
[linux:syslog]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%z
MAX_TIMESTAMP_LOOKAHEAD = 35
TRUNCATE = 10000
TRANSFORMS-rename_to_syslog = force_sourcetype_syslog
TRANSFORMS-drop_noisy_sourcetypes = ruleset_generic_suffix_drop, ruleset_literal_name_drop, ruleset_host_drop

[linux_yum]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 24
TRUNCATE = 10000
TRANSFORMS-drop_noisy_sourcetypes = ruleset_generic_suffix_drop, ruleset_literal_name_drop, ruleset_host_drop

[linux_aide]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=Start timestamp:)
TIME_PREFIX = Start timestamp:\s
TIME_FORMAT = %Y-%m-%d %H:%M:%S %z
MAX_TIMESTAMP_LOOKAHEAD = 30
TRUNCATE = 0

########################################
# IDENTITY (IMPORTANT)
########################################

[source::.../sudo.log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=\w{3}\s+\d{1,2}\s\d{2}:\d{2}:\d{2}\s:)
TIME_PREFIX = ^
TIME_FORMAT = %b %e %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
TRANSFORMS-routing = set_linux_secure

########################################
# AUTHENTICATION
########################################
[source::/var/log/auth.log]
TRANSFORMS-routing = set_linux_secure

[source::/var/log/secure]
TRANSFORMS-fix_sourcetype=st_linux_secure

########################################
# PACKAGE MANAGEMENT
########################################
[source::/var/log/yum.log]
TRANSFORMS-routing = set_linux_yum

[source::/var/log/dpkg.log]
TRANSFORMS-routing = set_linux_dpkg

[linux_yum]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 24
TRUNCATE = 10000
TRANSFORMS-drop_noisy_sourcetypes = ruleset_generic_suffix_drop, ruleset_literal_name_drop, ruleset_host_drop

########################################
# KERNEL (OPTIONAL)
########################################
[source::/var/log/kern.log]
TRANSFORMS-routing = set_linux_kern

############################
# FILE INTEGRITY MONITORING
#
# Low-volume, high-value telemetry.
############################
[linux_aide]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)(?=Start timestamp:)
TIME_PREFIX = Start timestamp:\s
TIME_FORMAT = %Y-%m-%d %H:%M:%S %z
MAX_TIMESTAMP_LOOKAHEAD = 30
TRUNCATE = 0

############################
# WEB ACCESS LOGS
############################
[source::/var/log/nginx/access.log]
TRANSFORMS-fix_sourcetype=st_nginx_access

[sourcetype::var-logs]
TRANSFORMS-drop_varlogs = drop_varlogs

[source::/var/log/secure]
TRANSFORMS-fix_sourcetype=st_linux_secure

[source::/var/log/messages]
TRANSFORMS-fix_sourcetype=st_syslog

[source::/var/log/nginx/access.log]
TRANSFORMS-fix_sourcetype=st_nginx_access

[source::/var/log/instance-state/instance-state*]
TRANSFORMS-null = drop_varlogs

[source::/var/log/instance-state/jstack*]
TRANSFORMS-null = drop_varlogs

[source::/var/log/cloud-init*]
TRANSFORMS-null = drop_varlogs

[source::/var/log/instance-state/*]
TRANSFORMS-null = drop_varlogs

[source::/var/log/tmp/emr/logpusher/log/logpusher*]
TRANSFORMS-null = drop_varlogs

[source::/var/log/dnf*]
TRANSFORMS-null = drop_varlogs

[source::/var/log/casrs/*]
TRANSFORMS-null = drop_varlogs

