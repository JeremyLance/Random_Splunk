###############################################################################
# Splunk_TA_nix (local) - transforms referenced by local/props.conf only.
# Drop/filter transforms moved to ZZZ_TA_hf_filtering.
###############################################################################
[linux_audit_drop_proctitle]
REGEX = type=PROCTITLE
DEST_KEY = queue
FORMAT = nullQueue

[force_sourcetype_syslog]
REGEX = .
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::syslog

[force_sourcetype_chrony]
REGEX = .
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::chrony_measurements

[force_sourcetype_linux_audit]
REGEX = .
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::linux_audit

[st_syslog]
REGEX = .
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::syslog

[st_linux_secure]
REGEX = .
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::linux_secure

[st_cron]
REGEX = .
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::cron

[st_nginx_access]
REGEX = .
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::nginx:access
