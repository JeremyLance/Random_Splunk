#########################################################
# Send matching events to nullQueue
#########################################################

[zzz_drop_noisy_sources]
REGEX = .
DEST_KEY = queue
FORMAT = nullQueue

[zzz_drop_by_source]
SOURCE_KEY = MetaData:Source
REGEX = (?i)(cloud-init|instance-state|/tmp/emr/|waagent|amazon/ssm|dynatrace|amazon-cloudwatch-agent)
DEST_KEY = queue
FORMAT = nullQueue
[linux_audit_drop_proctitle]
REGEX = type=PROCTITLE
DEST_KEY = queue
FORMAT = nullQueue

[force_sourcetype_syslog]
REGEX = (?s)^(.*)$
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::syslog

[force_sourcetype_chrony]
REGEX = (?s)^(.*)$
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::chrony_measurements

[force_sourcetype_linux_audit]
REGEX = (?s)^(.*)$
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::linux_audit

# Catches ANY sourcetype ending in -too_small or a trailing -<digits> (aide-2, aide-6, debug-21, instance-state-15, cron-too_small,
#  sudo-too_small, waagent-4, CommandExecution-3, etc. all match this)
[ruleset_generic_suffix_drop]
INGEST_EVAL = queue=if(match(sourcetype, "-(too_small|\d+)$"), "nullQueue", queue)
STOP_PROCESSING_IF = queue == "nullQueue"

# Catches sourcetypes with irregular / non-suffix naming that still need
# to be dropped outright (exact literal matches, alternated in one regex)
[ruleset_literal_name_drop]
INGEST_EVAL = queue=if(match(sourcetype, "^(too_small|aide\.log|allwin|boot|oneagent_latest_snapshot|node:sidecar:agent_manager:stdout|node:sidecar:cmp_orchestrator|node:sidecar:cmp_orchestrator:stdout|node:sidecar:ipc_broker:stdout|node:sidecar:postgres:stderr|secure_gateway_app_internal_log|diag_executor|dbx_server_connection_pool_metrics|dbx_server_health_metrics|_var_log_amazon_ssm_amazon-ssm-agent-too_small|_var_log_audit_audit-too_small|_var_log_messages-too_small|_opt_apigee_var_log_edge-message-processor_edge-message-processor-too_small|_Quadient_InspireScaler_logs_server-too_small|hadoop-yarn-resourcemanager-ip-10-157-116-74\.healthcareit\.net-too_small)$"), "nullQueue", queue)
STOP_PROCESSING_IF = queue == "nullQueue"

[ruleset_host_drop]
INGEST_EVAL = queue=if(match(host, "^az-2628[cp]-eastus2-medrx-active-gate(-synthetic)?$"), "nullQueue", queue)
STOP_PROCESSING_IF = queue == "nullQueue"

[st_linux_secure]
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::linux_secure

[st_syslog]
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::syslog

[st_nginx_access]
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::nginx:access

[st_linux_audit]
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::linux_audit

[st_cron]
DEST_KEY = MetaData:Sourcetype
FORMAT = sourcetype::cron

[drop_varlogs]
REGEX = .
DEST_KEY = queue
FORMAT = nullQueue
