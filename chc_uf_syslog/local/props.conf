[syslog-ng:stats]
SHOULD_LINEMERGE=false
LINE_BREAKER=([\r\n]+)[A-Z][a-z][a-z] [A-Z][a-z][a-z]\s+\d+\s\d\d
NO_BINARY_CHECK=true
TIME_FORMAT=%a %b %e %H:%M:%S %Z %Y
TIME_PREFIX=^
SEDCMD = s/SourceName;SourceId;SourceInstance;State;Type;Number\n//
REPORT-syslog_ng_parse_stats = syslog_ng_parse_stats

[netstat:stats]
CHARSET=UTF-8
DATETIME_CONFIG=CURRENT
LINE_BREAKER=([\r\n]+)Udp:
NO_BINARY_CHECK=true
SHOULD_LINEMERGE=false
category=Custom
disabled=false
pulldown_type=true