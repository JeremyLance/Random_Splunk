#syslog stats and catchall filter

[monitor:///opt/logs/syslog-netstat/*.log]
sourcetype = netstat:stats
index = sec_app_uhgid-000024
disabled = 0
_TCP_ROUTING=splunkcloud_security

[monitor:///opt/logs/syslog/*.log]
index = sec_app_uhgid-000024
sourcetype = syslog-ng:stats
disabled=0
_TCP_ROUTING=splunkcloud_security

[monitor:///opt/logs/catchall/*/*.log]
index=sec_app_uhgid-000024
sourcetype=syslog_unk
host_segment=4
disabled=0
_TCP_ROUTING=splunkcloud_security
