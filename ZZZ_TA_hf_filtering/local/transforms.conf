###############################################################################
# ZZZ_TA_hf_filtering - HF safety net for tenant uhgid-000024
# Deploy to: Heavy Forwarders (10.93.21.36-38) ONLY
#
# Every rule is scoped to indexes ending in _uhgid-000024 so other tenants
# that pass through these HFs are untouched.
# Order (see props.conf): 1) drop noise  2) fix sourcetype by source
#                         3) quarantine any leftover learned/garbage sourcetype
###############################################################################

# 1) Drop noise sources, rotated/compressed archives, and known noisy hosts
[a00_uhgid024_drop_noise]
INGEST_EVAL = queue=if(match(index, "_uhgid-000024$") AND (match(source, "^/var/log/(cloud-init|instance-state/|tmp/|amazon/|dynatrace/|commvault/|\.gxsetup/|aws/ams/|waagent|dnf|hawkey|casrs/|sssd/|cas(nt|rs)_installation\.log|user-?data|cfn-init|image_builder|vmware-vm|insights-client/|rhsm/|patch|azure/)|^/opt/dynatrace/|^/var/lib/amazon/|^/emr/|(-\d{8}|\.\d+|\.gz|\.bz\d?|\.zip)$") OR match(host, "^az-2628[cp]-eastus2-medrx-active-gate(-synthetic)?$")), "nullQueue", queue)
STOP_PROCESSING_IF = queue == "nullQueue"

# 2) Force correct sourcetype by file path (fixes learned names AND the
#    raw-event-text sourcetypes coming from /var/log/messages).
#    casapi/casnt are also re-routed to sec_app_uhgid-000024 (same as chc_mcds_dpapi_prod).
[a01_uhgid024_fix_sourcetype]
INGEST_EVAL = index=if(match(index, "_uhgid-000024$") AND match(source, "^/var/log/(casapi|casnt)/"), "sec_app_uhgid-000024", index), sourcetype=if(match(index, "_uhgid-000024$"), case(source=="/var/log/casapi/audit.log", "casapi:audit", source=="/var/log/casapi/debug.log", "casapi:debug", source=="/var/log/casapi/error.log", "casapi:error", source=="/var/log/casnt/audit.log", "casnt:audit", match(source, "^/var/log/(messages|syslog)$"), "syslog", match(source, "^/var/log/(secure|auth\.log|sudo\.log)$"), "linux_secure", source=="/var/log/cron", "cron", source=="/var/log/audit/audit.log", "linux_audit", source=="/var/log/aide/aide.log", "linux_aide", source=="/var/log/chrony/measurements.log", "chrony_measurements", source=="/var/log/nginx/access.log", "nginx:access", source=="/var/log/nginx/error.log", "nginx:error", true(), sourcetype), sourcetype)

# 3) Anything still carrying a learned/garbage sourcetype -> one holding sourcetype.
#    To DROP instead of quarantine, swap this stanza for the commented one below.
[a02_uhgid024_quarantine]
#INGEST_EVAL = sourcetype=if(match(index, "_uhgid-000024$") AND (match(sourcetype, "\s|-(too_small|\d+)$|^(0|too_small|var-logs)$") OR len(sourcetype) > 64), "uhgid024:unclassified", sourcetype)
INGEST_EVAL = queue=if(match(index, "_uhgid-000024$") AND (match(sourcetype, "\s|-(too_small|\d+)$|^(0|too_small|var-logs)$") OR len(sourcetype) > 64), "nullQueue", queue)
