###############################################################################
# ZZZ_TA_hf_filtering - HF safety net for tenant uhgid-000024
# Deploy to: Heavy Forwarders ONLY
#
# TRANSFORMS- runs on raw data from UFs (typingQueue).
# RULESET-    runs in rulesetQueue, which also sees data that arrives already
#             parsed (e.g. a rogue full Splunk agent). Rules are idempotent,
#             so running both is safe.
# Class name starts with "a00" so it runs before any other [default] TRANSFORMS.
# Parsing (line breaking / timestamps) lives in Splunk_TA_nix, not here.
###############################################################################
[default]
TRANSFORMS-a00_uhgid024_cleanup = a00_uhgid024_drop_noise, a01_uhgid024_fix_sourcetype, a02_uhgid024_quarantine
RULESET-a00_uhgid024_cleanup = a00_uhgid024_drop_noise, a01_uhgid024_fix_sourcetype, a02_uhgid024_quarantine
