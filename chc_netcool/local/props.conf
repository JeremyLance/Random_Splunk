TRUNCATE = 200000


############################################################
## JSON / audit payloads
## Apply these sourcetypes only if they exist in your environment.
############################################################

[aws:firehose:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
INDEXED_EXTRACTIONS = json
KV_MODE = none
TRUNCATE = 0
TIME_PREFIX = "(?:time|timestamp|eventTime)"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 128
MAX_DAYS_AGO = 3650
MAX_DAYS_HENCE = 365
TZ = UTC

[snaplogic:log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
INDEXED_EXTRACTIONS = json
KV_MODE = none
TRUNCATE = 0
TIME_PREFIX = "(?:time|timestamp|date)"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 128
MAX_DAYS_AGO = 3650
MAX_DAYS_HENCE = 365
TZ = UTC

[datadog:json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
INDEXED_EXTRACTIONS = json
KV_MODE = none
TRUNCATE = 0
TIME_PREFIX = "(?:timestamp|date|time)"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 128
MAX_DAYS_AGO = 3650
MAX_DAYS_HENCE = 365
TZ = UTC

[source::*/jcc_status.json]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
MAX_EVENTS = 2000
TRUNCATE = 250000


############################################################
## Traps
############################################################

[source::/var/log/traps/*]
TRANSFORMS-force = force_traps
