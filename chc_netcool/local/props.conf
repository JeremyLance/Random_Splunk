############################################################
## Global parsing safety - deterministic event breaking
############################################################

[default]
SHOULD_LINEMERGE = false
BREAK_ONLY_BEFORE_DATE = false
LINE_BREAKER = ([\r\n]+)
MAX_EVENTS = 10000
TRUNCATE = 200000
CHARSET = UTF-8
MAX_TIMESTAMP_LOOKAHEAD = 256
MAX_DAYS_AGO = 3650
MAX_DAYS_HENCE = 365
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000
TZ = UTC


############################################################
## Enforce clean sourcetypes everywhere
## Requires transforms.conf stanzas:
##   [strip_numeric_suffix]
##   [strip_toosmall_suffix]
############################################################

[host::*]
TRANSFORMS-fix_suffixes = strip_numeric_suffix, strip_toosmall_suffix


############################################################
## /var/log family - timing-safe baseline
############################################################

[source::/var/log/*]
SHOULD_LINEMERGE = false
BREAK_ONLY_BEFORE_DATE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
MAX_EVENTS = 10000
MAX_TIMESTAMP_LOOKAHEAD = 256
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000
MAX_DAYS_AGO = 3650
MAX_DAYS_HENCE = 365


############################################################
## Cloud-init logs
############################################################

[source::/var/log/cloud-init.log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 64
TRUNCATE = 200000
TRANSFORMS-force = force_cloud_init

[source::/var/log/cloud-init-output.log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 64
TRUNCATE = 200000
TRANSFORMS-force = force_cloud_init_output


############################################################
## Package, mail, cron, restore, and agent logs
############################################################

[source::/var/log/dnf.log]
TIME_PREFIX = ^
TIME_FORMAT = %a %b %d %H:%M:%S %Y
MAX_TIMESTAMP_LOOKAHEAD = 32
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000
TRANSFORMS-force = force_dnf

[source::/var/log/restore-runners.log]
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 32
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000

[source::/var/log/maillog]
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 64
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000

[source::/var/log/cron]
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 64
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000

[source::/var/log/amazon/amazon-cloudwatch-agent/*]
TRANSFORMS-force = force_cloudwatch
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
MAX_EVENTS = 1000
TRUNCATE = 200000

[source::/var/log/dynatrace/oneagent/*]
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 64
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+(?=\d{4}-\d{2}-\d{2}|\[\w+\]))
MAX_EVENTS = 1024
TRUNCATE = 200000


############################################################
## Instance-state and jstack logs
############################################################

[source::/var/log/instance-state/*]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
MAX_EVENTS = 20000
MAX_TIMESTAMP_LOOKAHEAD = 256
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000
MAX_DAYS_AGO = 3650
MAX_DAYS_HENCE = 365
TRANSFORMS-force = force_instance_state

[source::/var/log/instance-state/jstack*]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
MAX_EVENTS = 20000
MAX_TIMESTAMP_LOOKAHEAD = 256
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000
TRANSFORMS-force = force_jstack


############################################################
## Java / JVM / application logs
############################################################

[sourcetype::log4j]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+(?=\d{2}-\d{2}-\d{4}|\d{4}-\d{2}-\d{2}|INFO|WARN|ERROR|DEBUG|TRACE|Caused by:|Exception))
MAX_EVENTS = 1024
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %m-%d-%Y %H:%M:%S.%3N %z
MAX_TIMESTAMP_LOOKAHEAD = 128
MAX_DAYS_AGO = 3650
MAX_DAYS_HENCE = 365
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000

[sourcetype::java:*]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+(?=\d{4}-\d{2}-\d{2}|INFO|WARN|ERROR|Caused by:|Exception))
MAX_EVENTS = 1000
TRUNCATE = 200000

[app_log]
SHOULD_LINEMERGE = true
BREAK_ONLY_BEFORE = ^\d{4}-\d{2}-\d{2}
TRUNCATE = 0

[source::/opt/epsadmin/*]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+(?=\d{2}-\d{2}-\d{4}))
MAX_EVENTS = 1024
TRUNCATE = 200000

[source::*_gc.log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
MAX_EVENTS = 4096
TRUNCATE = 300000

# Verify this source pattern. Original appeared as: source::_/vendorrouter__gc.log
[source::*/vendorrouter*_gc.log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
MAX_EVENTS = 2048
TRUNCATE = 300000


############################################################
## Oracle, Hadoop, and Trino logs
############################################################

[source::/u01/app/oracle/.../trace/*.trc]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
MAX_EVENTS = 10000
MAX_TIMESTAMP_LOOKAHEAD = 256
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000

[source::/u01/app/oracle/diag/*/trace/*.trc]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+(?=\w{3}\s+\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}\s+\d{4}|\d{2}-\d{2}-\d{4}))
MAX_EVENTS = 4096
TRUNCATE = 500000
TIME_PREFIX = ^
MAX_TIMESTAMP_LOOKAHEAD = 256
MAX_DIFF_SECS_AGO = 315360000
MAX_DIFF_SECS_HENCE = 315360000
MAX_DAYS_AGO = 3650
MAX_DAYS_HENCE = 365

# Verify this source pattern. Original appeared as: /var/log/hadoop-_/_.log
[source::/var/log/hadoop-*/*.log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
MAX_EVENTS = 10000
MAX_TIMESTAMP_LOOKAHEAD = 256
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000

[source::/var/log/trino/*.log]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 200000
MAX_EVENTS = 10000
MAX_TIMESTAMP_LOOKAHEAD = 256
MAX_DIFF_SECS_AGO = 31536000
MAX_DIFF_SECS_HENCE = 31536000


############################################################
