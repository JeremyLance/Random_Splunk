###############################################
# WINDOWS LOGGING STANDARD
# ENTERPRISE SECURITY BASELINE
#
# COMPLIANCE NOTES
# - Based on Windows OS Comprehensive Logging Standard
# - TA-Windows native XmlWinEventLog sourcetypes
# - DNS query telemetry preserved
# - Windows Firewall isolated to sec_firewall
# - DNS isolated to sec_dns
# - Authentication, PKI, DHCP, AD in sec_auth
# - AD replication noise suppression retained
###############################################

############################
# SECURITY
############################

[WinEventLog://Security]
index = sec_os_uhgid-000024
disabled = 0
start_from = oldest
current_only = 0
evt_resolve_ad_obj = 1
checkpointInterval = 5
renderXml = true
sourcetype = XmlWinEventLog:Security

# AD object access noise suppression
blacklist1 = EventCode="4662" Message="Object Type:(?!\s_groupPolicyContainer)"
blacklist2 = EventCode="566" Message="Object Type:(?!\s_groupPolicyContainer)"

